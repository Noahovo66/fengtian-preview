<div class="pv-bar" role="note">預覽版・示範資料・表單不會送出　<a href="../../_preview/index.html">頁面導覽</a></div>
<script>
var PV_ROOT = '../../';
document.addEventListener('htmx:afterSwap', function (e) {
  e.detail.target.querySelectorAll('[data-pv-root]').forEach(function (el) {
    ['href', 'src'].forEach(function (a) {
      var v = el.getAttribute(a);
      if (v && v.charAt(0) !== '#') el.setAttribute(a, PV_ROOT + v);
    });
    el.removeAttribute('data-pv-root');
  });
});
document.addEventListener('submit', function (e) {
  var to = e.target.getAttribute('data-preview-next');
  e.preventDefault();
  if (to) location.href = to; else alert('預覽版：此操作不會真的送出。');
}, true);
document.addEventListener('click', function (e) {
  if (e.target.closest('a[data-preview-off]')) { e.preventDefault(); alert('預覽版未提供此頁面。'); }
}, true);
</script>
